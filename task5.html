    <li>Item 2</li>
  </ul>
  <button id="addBtn">Add Item</button>
  <button id="removeBtn">Remove Item</button>

  <script>
    $(document).ready(function(){

      $("#removeBtn").click(()=>$("#list li:last").remove());
