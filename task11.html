<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 11 - Image Gallery</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    #gallery img { width: 100px; margin: 5px; cursor: pointer; transition: all 0.3s; }
    #gallery img:hover { transform: scale(1.2); }
    #main { width: 300px; display: block; margin-bottom: 10px; }
    nav {
            background: #333; padding: 10px; color: #fff; text-align: center;
        }
        nav a {
            color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold;
        }
  </style>
</head>
<body>
  <nav>   
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
        <a href="task5.html">Task 5</a>
        <a href="task6.html">Task 6</a>
        <a href="task7.html">Task 7</a>
        <a href="task8.html">Task 8</a>
        <a href="task9.html">Task 9</a>
        <a href="task10.html">Task 10</a>
        <a href="task11.html">Task 11</a>
    </nav>

  <img id="main" src="https://via.placeholder.com/300" alt="Main Image">
  <div id="gallery">
    <img src="images.jpeg" alt="">
    <img src="i1.jpeg" alt="">
    <img src="i2.jpeg" alt="">
  </div>

  <script>
    $(document).ready(function(){
      $("#gallery img").click(function(){
        let src = $(this).attr("src").replace("/100/", "/300/");
        $("#main").fadeOut(200, function(){
          $(this).attr("src", src).fadeIn(200);
        });
      });
    });
  </script>
</body>
</html>
