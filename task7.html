  <form>
    <input type="text" id="name" placeholder="Name">
    <input type="email" id="email" placeholder="Email">
  </form>

  <p>Name: <span id="liveName"></span></p>
  <p>Email: <span id="liveEmail"></span></p>

  <script>
    $(document).ready(function(){
      $("#name").on("input", ()=>$("#liveName").text($("#name").val()));
      $("#email").on("input", ()=>$("#liveEmail").text($("#email").val()));
    });
  </script>
