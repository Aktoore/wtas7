  <img id="img" src="images.jpeg" alt="placeholder">
  <button id="fadeInBtn">Fade In</button>
  <button id="fadeOutBtn">Fade Out</button>
  <button id="fadeToggleBtn">Fade Toggle</button>

  <script>
    $(document).ready(function(){
      $("#fadeInBtn").click(()=>$("#img").fadeIn());
      $("#fadeOutBtn").click(()=>$("#img").fadeOut());
      $("#fadeToggleBtn").click(()=>$("#img").fadeToggle());
    });
  </script>
